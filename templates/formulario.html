{% extends "base.html" %}

{% block title %}Registro Corporativo - klbrs.es{% endblock %}

{% block content %}
<section id="main" class="wrapper">
	<div class="inner">
        	<header class="major">
        		<h2>Registro Corporativo</h2>
          		<p>Verifica tu dominio con registro TXT.</p>
        	</header>

        <section>
          <!-- Mensajes de estado -->
          	<div id="FORM_NOTICE" class="box" style="display:none;"></div>

		<div class="form-container">
		    	<form id="registroForm" action="/submit" method="post">
				<div class="form-group">
			    		<label>Nombre <span class="required">*</span></label>
			    		<input type="text" name="nombre" required placeholder="Tu nombre">
				</div>
				<div class="form-group">
					<label>Apellidos <span class="required">*</span></label>
					<input type="text" name="apellido" required placeholder="Tu apellido">
				</div>
				<div class="form-group">
			    		<label>Email Corporativo <span class="required">*</span></label>
			    		<input type="email" name="email" required placeholder="nombre@tuempresa.com">
				</div>
				<div class="form-group">
			    		<label>Teléfono</label>
			    		<input type="text" name="telefono" placeholder="Tu teléfono">
				</div>
				<div class="col-12">
					<ul class="actions">
					  	<li>
					    		<input type="submit" id="SUBMIT_BTN" value="Enviar" class="primary">
					  	</li>
					  	<li>
					    		<input type="reset" id="RESET_BTN" value="Limpiar">
					  	</li>
					</ul>
			     	</div>
		    	</form>
		    	<div id="loading" class="loading">Validando email...</div>
		    	<div class="warning">No se permiten emails gratuitos. Usa tu email corporativo.</div>
		</div>
	</section>
</section>

{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('registroForm').addEventListener('submit', function(e) {
        document.getElementById('loading').style.display = 'block';
        document.querySelector('button').disabled = true;
    });
</script>
{% endblock %}
