{% extends "base.html" %} {% block title %}Registro Corporativo - klbrs.es{%
endblock %} {% block content %}
<section id="main" class="wrapper">
  <div class="inner">
    <header class="major">
      <h2>Registro Corporativo</h2>
      <p>Verifica tu dominio con registro TXT.</p>
    </header>

    <div id="FORM_NOTICE" class="box" style="display: none"></div>

    <div class="form-container">
      <form id="registroForm" action="/submit" method="post">
        <div class="form-group">
          <label>Nombre <span class="required">*</span></label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            maxlength="80"
            required
            placeholder="Tu nombre"
          />
          <span id="nombre-error" class="field-error"></span>
        </div>

        <div class="form-group">
          <label>Apellidos <span class="required">*</span></label>
          <input
            type="text"
            id="apellido"
            name="apellido"
            maxlength="120"
            required
            placeholder="Tu apellido"
          />
          <span id="apellido-error" class="field-error"></span>
        </div>

        <div class="form-group">
          <label>Email Corporativo <span class="required">*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="nombre@tuempresa.com"
          />
          <span id="email-error" class="field-error"></span>
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input
            type="text"
            id="telefono"
            name="telefono"
            inputmode="numeric"
            placeholder="Tu teléfono"
          />
          <span id="telefono-error" class="field-error"></span>
        </div>

        <!-- Turnstile -->
        <div
          class="cf-turnstile"
          data-sitekey="0x4AAAAAADzKNJgXjE6-QvIN"
          data-callback="onTurnstileSuccess"
          data-expired-callback="onTurnstileExpired"
          data-error-callback="onTurnstileError"
        ></div>

        <input type="hidden" name="turnstile_token" id="TURNSTILE_TOKEN" />
        <!-- Aviso de privacidad -->
        <div class="col-12">
          <div class="privacy-wrapper">
            <input
              type="checkbox"
              id="privacy_accept"
              name="privacy_accept"
              required
            />
            <label for="privacy_accept">
              Conforme al RGPD y la LOPDGDD, KLBRS SECURITY SERVICES SL tratará
              los datos facilitados con la finalidad de gestionar y atender su
              solicitud. Para obtener más información acerca del tratamiento de
              sus datos y ejercer sus derechos, visite nuestra: Política de
              privacidad en:
              <a
                href="/politica-de-privacidad.html"
                target="_blank"
                rel="noopener"
              >
                Política de Privacidad </a
              >.
            </label>
          </div>
        </div>
        <div class="col-12">
          <ul class="actions">
            <li>
              <button type="submit" id="SUBMIT_BTN" class="primary" disabled>
                Enviar
              </button>
            </li>
            <li>
              <input type="reset" id="RESET_BTN" value="Limpiar" />
            </li>
          </ul>
        </div>
      </form>
    </div>

    <!-- ============================================ -->
    <!-- SECCIÓN DE PAGO (se muestra después de verificar DNS) -->
    <!-- ============================================ -->
    <div id="seccionPagoContainer" style="display: none; margin-top: 30px;">
      {% include 'components/pago.html' %}
    </div>

  </div>
</section>

{% endblock %} {% block extra_js %}
<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"
  async
  defer
></script>
<script src="/static/js/registro.js"></script>

<script>
// ============================================
// FUNCIONES PARA MOSTRAR LA SECCIÓN DE PAGO
// ============================================

// Función para mostrar la sección de pago después de verificar DNS
function mostrarSeccionPago(codigo, email) {
    console.log('✅ Mostrando sección de pago para código:', codigo);
    
    // Mostrar el contenedor
    const container = document.getElementById('seccionPagoContainer');
    if (container) {
        container.style.display = 'block';
    }
    
    // Establecer el código en el componente de pago
    if (typeof setCodigoPago === 'function') {
        setCodigoPago(codigo);
    }
    
    // Guardar el email para usarlo en el pago
    if (typeof setEmailPago === 'function') {
        setEmailPago(email);
    }
    
    // Hacer scroll a la sección de pago
    setTimeout(() => {
        container?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 500);
}

// Función para guardar el email
function setEmailPago(email) {
    window.emailPago = email;
}

// Función para obtener el email
function getEmailPago() {
    return window.emailPago || document.getElementById('email')?.value || '';
}

// Modificar la función setCodigoPago para que también guarde el email
const originalSetCodigoPago = window.setCodigoPago;
window.setCodigoPago = function(codigo) {
    if (typeof originalSetCodigoPago === 'function') {
        originalSetCodigoPago(codigo);
    }
    // Guardar el email también
    const email = document.getElementById('email')?.value || '';
    window.emailPago = email;
};

console.log('✅ Formulario cargado - Sección de pago lista');
</script>

{% endblock %}
