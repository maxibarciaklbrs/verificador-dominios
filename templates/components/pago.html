<section id="seccionPago">
  <div class="dropdown">
    <button
      id="btnPago"
      class="primary"
      onclick="togglePago()"
      style="display: none"
    >
      💳 Sección Pago ▼
    </button>

    <div id="menuPago" style="display: none">
      <!-- Botón para pagar con Stripe -->
      <button 
        id="btnRealizarPago" 
        class="button success" 
        onclick="realizarPagoConStripe()"
        style="width: 100%; margin-bottom: 10px;"
      >
        💳 Pagar con Stripe (€50)
      </button>
      
      <!-- Botón legacy para simulación manual (opcional) -->
      <button 
        id="btnPagoManual" 
        class="button secondary" 
        onclick="realizarPagoManual()"
        style="width: 100%; margin-bottom: 10px; font-size: 0.8em;"
      >
        🔧 Simular Pago Manual
      </button>
      
      <a onclick="mostrarMensaje('pago-completado')" class="button">
        ✅ Verificar Estado
      </a>
    </div>
  </div>
</section>

<script>
let codigoVerificacion = '';

// Función para establecer el código de verificación
function setCodigoPago(codigo) {
    codigoVerificacion = codigo;
    document.getElementById('btnPago').style.display = 'block';
}

// Función para realizar pago con Stripe
async function realizarPagoConStripe() {
    const email = document.getElementById('email')?.value || '';
    const codigo = codigoVerificacion || document.getElementById('codigo')?.value || '';
    
    if (!codigo || !email) {
        mostrarMensaje('error', 'Faltan datos: código de verificación o email');
        return;
    }
    
    // Mostrar loading
    const btn = document.getElementById('btnRealizarPago');
    const textoOriginal = btn.textContent;
    btn.textContent = '⏳ Procesando...';
    btn.disabled = true;
    
    try {
        const response = await fetch('/api/pago/crear-sesion-stripe', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                codigo: codigo,
                email: email
            })
        });
        
        const data = await response.json();
        
        if (data.exitoso) {
            // Redirigir a Stripe
            window.location.href = data.checkout_url;
        } else {
            mostrarMensaje('error', data.mensaje || 'Error al crear sesión de pago');
            btn.textContent = textoOriginal;
            btn.disabled = false;
        }
    } catch (error) {
        console.error('Error:', error);
        mostrarMensaje('error', 'Error de conexión. Intenta nuevamente.');
        btn.textContent = textoOriginal;
        btn.disabled = false;
    }
}

// Función para simular pago manual (legacy)
async function realizarPagoManual() {
    const email = document.getElementById('email')?.value || '';
    const codigo = codigoVerificacion || document.getElementById('codigo')?.value || '';
    
    if (!codigo || !email) {
        mostrarMensaje('error', 'Faltan datos: código de verificación o email');
        return;
    }
    
    const btn = document.getElementById('btnPagoManual');
    const textoOriginal = btn.textContent;
    btn.textContent = '⏳ Procesando...';
    btn.disabled = true;
    
    try {
        const response = await fetch('/api/pago/webhook-pago', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                codigo: codigo,
                monto: 50.00
            })
        });
        
        const data = await response.json();
        
        if (data.exitoso) {
            mostrarMensaje('exito', data.mensaje);
            // Recargar para actualizar estado
            setTimeout(() => {
                window.location.reload();
            }, 2000);
        } else {
            mostrarMensaje('error', data.mensaje || 'Error al procesar pago manual');
        }
    } catch (error) {
        console.error('Error:', error);
        mostrarMensaje('error', 'Error de conexión');
    }
    
    btn.textContent = textoOriginal;
    btn.disabled = false;
}

// Función para verificar estado del pago
async function verificarEstadoPago(codigo) {
    if (!codigo) return;
    
    try {
        const response = await fetch(`/api/pago/estado-pago/${codigo}`);
        const data = await response.json();
        
        if (data.exitoso) {
            if (data.pagado) {
                mostrarMensaje('exito', '✅ ¡Pago confirmado! Ya puedes realizar el escaneo.');
                // Habilitar botón de escaneo
                document.getElementById('btnEscaneo')?.style.display('block');
            } else {
                mostrarMensaje('info', '⏳ Aún no se ha registrado tu pago.');
            }
        }
    } catch (error) {
        console.error('Error verificando estado:', error);
    }
}

// Función para toggle del menú
function togglePago() {
    const menu = document.getElementById('menuPago');
    if (menu.style.display === 'none') {
        menu.style.display = 'block';
        // Verificar estado al abrir
        const codigo = codigoVerificacion || document.getElementById('codigo')?.value || '';
        if (codigo) {
            verificarEstadoPago(codigo);
        }
    } else {
        menu.style.display = 'none';
    }
}

// Función para mostrar mensajes
function mostrarMensaje(tipo, mensaje) {
    const container = document.getElementById('mensajesContainer') || document.body;
    const div = document.createElement('div');
    div.className = `mensaje ${tipo}`;
    div.style.cssText = `
        padding: 12px;
        margin: 10px 0;
        border-radius: 4px;
        background: ${tipo === 'exito' ? '#d4edda' : tipo === 'error' ? '#f8d7da' : '#cce5ff'};
        color: ${tipo === 'exito' ? '#155724' : tipo === 'error' ? '#721c24' : '#004085'};
        border: 1px solid ${tipo === 'exito' ? '#c3e6cb' : tipo === 'error' ? '#f5c6cb' : '#b8daff'};
    `;
    div.textContent = mensaje;
    container.appendChild(div);
    
    // Auto-eliminar después de 5 segundos
    setTimeout(() => {
        div.remove();
    }, 5000);
}

console.log('✅ Componente de pago cargado correctamente');
</script>

<style>
/* Estilos para los botones */
.button.success {
    background: #28a745;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1em;
    transition: background 0.3s;
}

.button.success:hover {
    background: #218838;
}

.button.success:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.button.secondary {
    background: #6c757d;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9em;
    transition: background 0.3s;
}

.button.secondary:hover {
    background: #5a6268;
}

.mensaje {
    padding: 12px;
    margin: 10px 0;
    border-radius: 4px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
